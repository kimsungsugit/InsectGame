name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: C# Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check namespace convention
        run: |
          echo "=== InsectGame 네임스페이스 규칙 검증 ==="
          errors=0
          while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            # namespace 선언이 있는 파일만 검사
            ns=$(grep -m1 "^namespace " "$file" 2>/dev/null | sed 's/namespace \([^ {]*\).*/\1/')
            if [ -n "$ns" ]; then
              if [[ ! "$ns" == InsectGame* ]]; then
                echo "ERROR: $file uses namespace '$ns' - should be InsectGame.*"
                errors=$((errors + 1))
              fi
            else
              # namespace 없는 .cs 파일 경고 (Tests 제외)
              if [[ "$file" != *Tests* ]] && [[ "$file" != *Editor* ]]; then
                echo "WARN: $file has no namespace declaration"
              fi
            fi
          done < <(find Assets/Scripts -name "*.cs" 2>/dev/null)
          if [ $errors -gt 0 ]; then
            echo "::error::$errors file(s) violate namespace convention"
            exit 1
          fi
          echo "All files pass namespace check"

      - name: Check for prohibited patterns
        run: |
          echo "=== 금지 패턴 검사 ==="
          errors=0

          # public 필드 직접 노출 검사 (SerializeField가 아닌 public 필드)
          count=$(grep -rn "^\s*public\s\+\(int\|float\|string\|bool\|List\|Dictionary\)\s" Assets/Scripts/ --include="*.cs" \
            | grep -v "static\|const\|readonly\|event\|delegate\|override\|abstract\|//\|{\s*get" \
            | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "WARN: $count potential public field(s) found (prefer [SerializeField] private)"
          fi

          # MonoBehaviour 생성자 검사
          while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            classname=$(basename "$file" .cs)
            if grep -q ": MonoBehaviour" "$file" 2>/dev/null; then
              if grep -qE "^\s*(public|private|protected)\s+$classname\s*\(" "$file" 2>/dev/null; then
                echo "ERROR: $file has a constructor on MonoBehaviour (use Awake/Start)"
                errors=$((errors + 1))
              fi
            fi
          done < <(find Assets/Scripts -name "*.cs" 2>/dev/null)

          if [ $errors -gt 0 ]; then
            echo "::error::$errors prohibited pattern(s) found"
            exit 1
          fi
          echo "All checks passed"

      - name: Verify save system consistency
        run: |
          echo "=== 세이브 시스템 일관성 검사 ==="
          # GameConstants.SaveFiles에 정의된 파일명이 실제 사용되는지 확인
          if [ -f "Assets/Scripts/Core/GameConstants.cs" ]; then
            echo "GameConstants.cs found - checking save file references"
            save_files=$(grep -oP '"[a-z_]+\.json"' Assets/Scripts/Core/GameConstants.cs 2>/dev/null || true)
            if [ -n "$save_files" ]; then
              echo "Defined save files:"
              echo "$save_files"
            fi
          fi
          echo "Save system check complete"

  test:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: EditMode
          unityVersion: 6000.3.10f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build (StandaloneWindows64)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.10f1
          targetPlatform: StandaloneWindows64
          buildName: InsectGame

      - uses: actions/upload-artifact@v4
        with:
          name: build-StandaloneWindows64
          path: build/StandaloneWindows64
