name: CI

# CI는 검사를 재구현하지 않는다. 세션에서 돌던 하네스 훅·스크립트를 그대로 돌린다.
# 규칙의 단일 출처는 .claude/hooks/*.py 와 .claude/scripts/*.py 이고 여기선 호출만 한다.
# 예전엔 이 파일이 네임스페이스 규칙을 bash로 재구현했다 — 같은 규칙의 다섯 번째 사본이었다.
#
# CI가 잡는 것: 세션 밖에서 들어온 위반 (Codex CLI 병행, 손편집, 다른 기계의 커밋).
# 세션 안 편집은 같은 훅이 실시간으로 이미 잡는다.
#
# Unity 잡(EditMode 테스트 / StandaloneWindows64 빌드)은 제거했다. 근거:
#  - UNITY_LICENSE 등 시크릿이 미설정이라 원천적으로 못 돈다. 실제로 최초 커밋(2026-04-15)에
#    한 번 돌고 14초 만에 실패한 뒤 3개월간 빨간불이었다. 죽은 빨강은 없느니만 못하다.
#  - testMode: EditMode 는 0개를 실행하고 result="Passed" + exit 0을 낸다. 이 프로젝트엔
#    asmdef가 없어 테스트 38개가 Assembly-CSharp로 컴파일돼 EditMode 러너에 안 보인다.
#    즉 시크릿을 넣어 되살렸어도 "0개 통과"를 초록으로 보고했을 뿐이다
#    (자세한 건 .claude/rules/testing.md).
#  - 빌드 타깃도 StandaloneWindows64였다 — 이 게임은 Android APK로 출시한다.
# 테스트를 CI에서 돌리려면 Unity 라이선스를 Secrets에 넣고 **PlayMode** 러너로 되살릴 것.
# 그때까진 로컬 /test 가 유일한 테스트 경로다.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  harness:
    name: 하네스 검사 (네임스페이스 · 데이터 정합성 · 미러 동기)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ci-check
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: python -X utf8 .claude/scripts/ci_check.py
